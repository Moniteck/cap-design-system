<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap">
<style>
  .mx { --page:#F1EDE9; --card:#FFFDFB; --div:#E6DFD8; --red:#B12530; --wine:#6E1219; --redmid:#DB7F87; --rose:#F2D3D6; --tint:#FBEDEE; --muted:#D2CAC3; --ink:#1E1B1A; --soft:#7A6F67;
        font-family:Inter,sans-serif; color:var(--ink); display:flex; gap:28px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .mx * { box-sizing:border-box; }
  .mx figure { margin:0; text-align:center; }
  .mx figcaption { font-size:13px; color:#555; margin-top:10px; }
  .mx .phone { position:relative; width:320px; height:660px; border-radius:44px; overflow:hidden; background:var(--page); border:8px solid #1a1a1a; text-align:left; }
  .mx .phone::before { content:""; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(260px 220px at 10% 12%, rgba(177,37,48,.18), transparent 70%),
                radial-gradient(300px 260px at 95% 80%, rgba(110,18,25,.14), transparent 70%); }
  .mx .glass { background:rgba(30,27,26,.62); backdrop-filter:blur(22px) saturate(170%); -webkit-backdrop-filter:blur(22px) saturate(170%);
    border:1px solid rgba(255,255,255,.14); color:#fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 10px 28px rgba(30,27,26,.22); }
  .mx .scroll { position:absolute; inset:0; overflow-y:auto; padding:44px 14px 110px; display:flex; flex-direction:column; gap:10px; scrollbar-width:none; }
  .mx .scroll::-webkit-scrollbar { display:none; }
  .mx .status { position:absolute; z-index:4; top:0; left:0; right:0; height:36px; display:flex; justify-content:space-between; align-items:center; padding:0 22px; font-size:13px; font-weight:600; }
  .mx .top { position:absolute; z-index:3; top:38px; left:10px; right:10px; height:52px; border-radius:20px; display:flex; align-items:center; gap:8px; padding:0 8px 0 8px; }
  .mx .top b { flex:1; font:600 15px Poppins; }
  .mx .ib { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-size:19px; background:rgba(255,255,255,.10); position:relative; }
  .mx .ib .d { position:absolute; right:7px; top:7px; width:7px; height:7px; border-radius:50%; background:var(--red); }
  .mx .ib.solid { background:var(--red); }
  .mx .logo { width:36px; height:36px; border-radius:50%; background:var(--red); display:grid; place-items:center; font:600 14px Poppins; }
  .mx .hello { padding:58px 4px 2px; }
  .mx .hello small { font-size:13px; color:var(--soft); }
  .mx .hello h3 { margin:0; font:600 22px Poppins; }
  .mx .card { background:var(--card); border:1px solid var(--div); border-radius:20px; padding:14px; }
  .mx .feat { background:var(--wine); border-color:var(--wine); color:#fff; }
  .mx .tint { background:var(--tint); border-color:#F3DADD; }
  .mx .lbl { font-size:12px; font-weight:500; display:flex; justify-content:space-between; align-items:center; }
  .mx .num { font:600 24px Poppins; margin-top:4px; font-variant-numeric:tabular-nums; }
  .mx .sub { font-size:11.5px; color:var(--soft); }
  .mx .feat .sub { color:rgba(255,255,255,.75); }
  .mx .bar { height:6px; border-radius:999px; background:rgba(255,255,255,.2); margin-top:10px; }
  .mx .bar div { height:100%; width:79%; border-radius:999px; background:#fff; }
  .mx .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mx .chip-ic { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; font-size:19px; }
  .mx .arrow { width:28px; height:28px; border-radius:50%; background:#fff; color:var(--ink); display:grid; place-items:center; font-size:15px; }
  .mx .mini { display:flex; align-items:flex-end; gap:4px; height:34px; margin-top:8px; }
  .mx .mini div { flex:1; border-radius:999px; }
  .mx .row { display:flex; align-items:center; gap:10px; }
  .mx .chips { display:flex; gap:6px; overflow:hidden; padding:58px 2px 4px; }
  .mx .chips span { flex-shrink:0; height:32px; padding:0 13px; border-radius:999px; font-size:12.5px; display:flex; align-items:center; background:var(--card); border:1px solid var(--div); }
  .mx .chips span.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .mx .stat3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .mx .stat3 div { border-radius:16px; padding:10px; font-size:11px; }
  .mx .stat3 b { display:block; font:600 20px Poppins; margin-top:2px; }
  .mx .inv { display:flex; align-items:center; gap:10px; }
  .mx .inv .ic { width:38px; height:38px; border-radius:12px; background:var(--tint); color:var(--red); display:grid; place-items:center; font-size:19px; flex-shrink:0; }
  .mx .inv .t { flex:1; min-width:0; }
  .mx .inv .t b { font-size:13.5px; font-weight:600; display:block; }
  .mx .inv .r { text-align:right; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
  .mx .st { display:inline-block; margin-top:4px; font-size:10.5px; font-weight:500; padding:1px 7px; border-radius:999px; }
  .mx .ok { background:#E7F4EC; color:#1E6B3A; }
  .mx .pe { background:#FCF1DC; color:#7A4E00; }
  .mx .er { background:var(--tint); color:var(--red); }
  .mx .tabs { position:absolute; z-index:3; left:10px; right:10px; bottom:14px; height:64px; border-radius:24px; display:flex; justify-content:space-around; align-items:center; padding:0 6px; }
  .mx .tab { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10.5px; color:var(--muted); width:56px; padding:6px 0; border-radius:16px; }
  .mx .tab i { font-size:21px; line-height:1; }
  .mx .tab.on { color:#fff; background:rgba(255,255,255,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.22); }
  .mx .tab.on i { color:#fff; }
  .mx .fab { position:absolute; z-index:3; right:18px; bottom:92px; width:52px; height:52px; border-radius:50%; background:var(--red); color:#fff; display:grid; place-items:center; font-size:26px; box-shadow:0 8px 20px rgba(177,37,48,.35), inset 0 1px 0 rgba(255,255,255,.3); }
  .mx .sheet-dim { position:absolute; inset:0; z-index:4; background:rgba(21,21,21,.35); }
  .mx .sheet { position:absolute; z-index:5; left:8px; right:8px; bottom:8px; border-radius:28px; padding:10px 12px 14px; }
  .mx .grab { width:38px; height:4px; border-radius:4px; background:rgba(255,255,255,.35); margin:2px auto 12px; }
  .mx .sheet .item { display:flex; align-items:center; gap:12px; height:44px; padding:0 12px; border-radius:14px; font-size:14px; color:#E9E4E0; }
  .mx .sheet .item i { font-size:21px; }
  .mx .sheet .item.on { background:rgba(255,255,255,.16); color:#fff; }
  .mx .sheet .grp { font-size:11px; color:var(--muted); margin:8px 12px 4px; }
  .mx .cnt { margin-left:auto; font-size:11px; padding:1px 8px; border-radius:999px; background:rgba(255,255,255,.14); }
  .mx .user { display:flex; align-items:center; gap:10px; padding:12px 12px 2px; border-top:1px solid rgba(255,255,255,.12); margin-top:8px; }
  .mx .av { width:36px; height:36px; border-radius:50%; background:#A89C91; display:grid; place-items:center; font-size:12px; font-weight:600; color:#fff; }
  .mx .switch { margin-left:auto; width:34px; height:20px; border-radius:999px; background:rgba(255,255,255,.18); position:relative; }
  .mx .switch::after { content:""; position:absolute; left:2px; top:2px; width:16px; height:16px; border-radius:50%; background:#fff; }
</style>
